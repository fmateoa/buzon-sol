openapi: 3.1.0
info:
  title: Buzón SOL backend
  version: 0.1.0
  description: >-
    Contrato actual de la API. Los comandos SUNAT permanecen desactivados hasta
    superar las puertas de validación correspondientes. Fechas internas en UTC.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: health
      description: Liveness. El proceso responde; no consulta ninguna dependencia.
      security: []
      responses:
        '200': { description: Servicio iniciado }
  /health/ready:
    get:
      operationId: healthReady
      description: >
        Readiness. Comprueba MySQL y, solo si alguna puerta SUNAT que encola trabajo está activa, Redis (cada una con
        tope de 2 s). Con todas las puertas apagadas Redis figura como `skipped`. No revela el motivo de un fallo.
      security: []
      responses:
        '200':
          description: Puede servir su función esencial
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  checks:
                    type: object
                    properties:
                      database: { type: string, enum: [ok] }
                      redis: { type: string, enum: [ok, skipped] }
        '503':
          description: Una dependencia imprescindible no responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
                  checks:
                    type: object
                    properties:
                      database: { type: string, enum: [ok, down] }
                      redis: { type: string, enum: [ok, down, skipped] }
  /auth/login:
    post:
      operationId: login
      security: []
      description: >
        Con la cabecera `X-Session-Mode: cookie` (la web) la sesión viaja en la cookie `bz_session`
        (HttpOnly, SameSite=Strict, Path=/api/v1) y la respuesta solo trae `expiresAt`; se fija además
        `bz_csrf`, que la web devuelve en `X-CSRF-Token` en POST/PATCH. Sin esa cabecera se devuelve el token Bearer.
      parameters:
        - { name: X-Session-Mode, in: header, required: false, schema: { type: string, enum: [cookie] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '201':
          description: Sesión de 12 horas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Sesión revocada }
        default: { $ref: '#/components/responses/Error' }
  /auth/activity:
    post:
      operationId: sessionActivity
      description: >
        Renueva la ventana de inactividad de la sesión. Lo llama la web ante uso real (teclado, clic);
        las consultas en segundo plano autentican pero no la renuevan. Como mucho una escritura por minuto.
      responses:
        '204': { description: Actividad registrada }
        default: { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Identidad y permisos vigentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        default: { $ref: '#/components/responses/Error' }
  /auth/me/preferences:
    patch:
      operationId: updatePreferences
      description: Preferencia propia del usuario; queda en auditoría.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesInput' }
      responses:
        '204': { description: Preferencia guardada }
        default: { $ref: '#/components/responses/Error' }
  /accounts:
    get:
      operationId: visibleAccounts
      x-permission: view_mailbox
      responses:
        '200': { description: 'Cuentas visibles para el rol: id, alias, active, rucMasked, scheduleState, pauseReason' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/mail:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listMail
      x-permission: view_mailbox
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - { name: box, in: query, schema: { type: string, enum: [all, messages, notifications], default: all } }
        - name: state
          in: query
          description: unread es indEstado=0; cualquier otro valor observado cuenta como leído
          schema: { type: string, enum: [all, unread, read], default: all }
        - { name: review, in: query, schema: { type: string, enum: [all, reviewed, pending], default: all } }
        - name: content
          in: query
          description: stored son los elementos con contenido guardado (lectura explícita o archivo de la cuenta)
          schema: { type: string, enum: [all, stored, missing], default: all }
        - { name: q, in: query, description: Texto literal en asunto o remitente, schema: { type: string, maxLength: 200 } }
        - { name: dateFrom, in: query, description: Día inclusivo en America/Lima, schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: Día inclusivo en America/Lima, schema: { type: string, format: date } }
        - { name: folder, in: query, schema: { type: string, maxLength: 40 } }
        - { name: label, in: query, schema: { type: string, maxLength: 40 } }
        - { name: seenAfter, in: query, description: Solo elementos vistos por primera vez después de este instante, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [publishedAt, subject, sender, remoteState, firstSeenAt], default: publishedAt } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Metadatos persistidos; nunca consulta SUNAT ni abre detalle. reviewed es privado del usuario
          content:
            application/json:
              schema:
                type: object
                required: [rows, total, offset, limit]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/MailItem' }
                  total: { type: integer, description: Filas persistidas que cumplen el filtro }
                  offset: { type: integer }
                  limit: { type: integer }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/folders:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listFolders
      x-permission: view_mailbox
      responses:
        '200':
          description: Último catálogo listarCarpetas observado; nunca consulta SUNAT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/labels:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listLabels
      x-permission: view_mailbox
      responses:
        '200':
          description: Último catálogo listEtiquetas observado en el visor; nunca consulta SUNAT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/summary:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: accountSummary
      x-permission: view_mailbox
      responses:
        '200': { description: Estado actual y línea base de la última corrida completa }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/activity:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: accountActivity
      x-permission: view_mailbox
      responses:
        '200': { description: 'Corrida actual, páginas y últimas 20 corridas con bandejas, estado de catálogos y alertas (ok | unavailable | null), reautenticaciones y elementos nuevos desde la última corrida completa (null en la primera)' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/inventory:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      operationId: startInventory
      x-permission: run_inventory
      description: Responde 503 con `remote_disabled` si las consultas están desactivadas en este servidor.
      responses:
        '201':
          description: Corrida persistida y encolada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        default: { $ref: '#/components/responses/Error' }
  /inventory:
    post:
      operationId: startAllInventories
      x-permission: run_inventory
      description: >-
        Inicia un inventario por cada cuenta activa que el usuario puede consultar. Cada cuenta tiene su propia
        corrida y sesión; la que no puede iniciar informa su código y no detiene a las demás. Responde 503 con
        `remote_disabled` si las consultas están desactivadas en este servidor.
      responses:
        '201':
          description: Resultado por cuenta
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountRunResult' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/archive:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: getArchiveStatus
      x-permission: view_mailbox
      responses:
        '200':
          description: Avance del archivo de la cuenta en cantidades; nunca consulta SUNAT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveStatus' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: startArchive
      x-permission: run_inventory y read_content
      description: >-
        Encola un lote de archivo. El worker guarda contenido y archivos solo de elementos que SUNAT ya lista como
        leídos; un no leído se abre únicamente con la lectura explícita. Requiere SUNAT_READ_VALIDATED, la cuenta
        activa con archiveContent y credencial válida.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retryFailed: { type: boolean, default: false, description: Da otra ronda a elementos y archivos que agotaron sus intentos }
      responses:
        '201':
          description: Lote persistido y encolado, o el que ya estaba en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveRunResult' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/runs/{runId}/resume:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      operationId: resumeInventory
      x-permission: run_inventory
      responses:
        '201':
          description: Corrida reencolada desde su checkpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/items/{itemId}/read:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/ItemId' }
    post:
      operationId: readContent
      x-permission: read_content
      description: Registra la intención antes de abrir detalle remoto; puede cambiar indEstado.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
      responses:
        '201':
          description: Evento de lectura existente o nuevo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadResult' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getItem
      x-permission: view_mailbox
      responses:
        '200':
          description: Metadatos persistidos de un elemento; nunca consulta SUNAT ni abre detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailItem' }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/items/{itemId}/reads/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getReadStatus
      x-permission: read_content
      responses:
        '200':
          description: Avance de una lectura explícita encolada
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, calling, complete, uncertain, failed, denied] }
                  remoteBefore: { type: integer, nullable: true }
                  remoteAfter: { type: integer, nullable: true }
                  updateLeido: { type: boolean, nullable: true }
        default: { $ref: '#/components/responses/Error' }
  /admin/runs:
    get:
      operationId: listAllRuns
      x-permission: manage_accounts
      responses:
        '200': { description: Últimas 200 consultas de todas las cuentas con su alias; solo estado persistido }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/items/{itemId}/detail:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/ItemId' }
    get:
      operationId: storedDetail
      x-permission: read_content
      responses:
        '200': { description: HTML saneado y archivos asociados ya persistidos }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/items/{itemId}/review:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/ItemId' }
    patch:
      operationId: setReviewed
      x-permission: mark_reviewed
      description: Cambia solo el estado local del usuario; no llama a SUNAT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '204': { description: Estado local actualizado y auditado }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/files/{fileId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/FileId' }
    get:
      operationId: downloadStoredFile
      x-permission: download_file
      responses:
        '200':
          description: Archivo privado ya almacenado
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/files/{fileId}/fetch:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/FileId' }
    post:
      operationId: fetchFile
      x-permission: download_file
      description: Obtiene un archivo descubierto en una lectura explícita previa.
      responses:
        '201': { description: Obtención persistida y encolada, o archivo ya almacenado }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/files/{fileId}/fetches/{fetchId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/FileId' }
      - { $ref: '#/components/parameters/FetchId' }
    get:
      operationId: fileFetchStatus
      x-permission: download_file
      responses:
        '200': { description: Estado persistido de la obtención }
        default: { $ref: '#/components/responses/Error' }
  /accounts/{accountId}/schedule:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: getSchedule
      x-permission: configure_schedule
      responses:
        '200': { description: Configuración persistida y próximos horarios Lima }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: saveSchedule
      x-permission: configure_schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '204': { description: Programación guardada }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts:
    get:
      operationId: managedAccounts
      x-permission: manage_accounts
      responses:
        '200': { description: 'Cuentas con RUC y usuario SOL enmascarados, createdAt, credentialStatus, credentialSavedAt, scheduleState, pauseReason, nextRunAt y userCount' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAccount
      x-permission: manage_accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201': { description: ID de nueva cuenta; no devuelve secretos }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    patch:
      operationId: updateAccount
      x-permission: manage_accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '204': { description: Alias actualizado; el usuario SOL solo cambia si se envía }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/users:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: accountUsers
      x-permission: manage_accounts
      responses:
        '200': { description: 'Usuarios cuyo rol alcanza la cuenta: id, email, name, status, roleId, roleName, lastLoginAt' }
        default: { $ref: '#/components/responses/Error' }
  /admin/account-options:
    get:
      operationId: accountOptions
      x-permission: manage_users_roles o manage_accounts
      responses:
        '200': { description: Solo id y alias de cada cuenta, para asignarlas a roles }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/active:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    patch:
      operationId: setAccountActive
      x-permission: manage_accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveInput' }
      responses:
        '204': { description: Cuenta activada o desactivada }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/mailbox-settings:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: getMailboxSettings
      x-permission: manage_accounts
      responses:
        '200':
          description: Configuración del archivo de la cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailboxSettings' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: saveMailboxSettings
      x-permission: manage_accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailboxSettingsInput' }
      responses:
        '204': { description: Configuración guardada y auditada }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/credential:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      operationId: replaceCredential
      x-permission: manage_accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '204': { description: Clave SOL reemplazada y cifrada para el worker }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/connection-tests:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
    post:
      operationId: testConnection
      x-permission: manage_accounts
      responses:
        '201': { description: Prueba de conexión persistida y encolada; no expone credenciales }
        default: { $ref: '#/components/responses/Error' }
  /admin/accounts/{accountId}/connection-tests/{testId}:
    parameters:
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/TestId' }
    get:
      operationId: connectionTest
      x-permission: manage_accounts
      responses:
        '200': { description: Estado persistido de la prueba sin secretos }
        default: { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listUsers
      x-permission: manage_users_roles
      responses:
        '200': { description: 'Usuarios sin hashes de contraseña, con roleName y lastLoginAt (último ingreso)' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      x-permission: manage_users_roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201': { description: ID del nuevo usuario }
        default: { $ref: '#/components/responses/Error' }
  /users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      operationId: updateUser
      x-permission: manage_users_roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '204': { description: Usuario actualizado }
        default: { $ref: '#/components/responses/Error' }
  /users/{userId}/status:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      operationId: setUserStatus
      x-permission: manage_users_roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusInput' }
      responses:
        '204': { description: Usuario habilitado o deshabilitado }
        default: { $ref: '#/components/responses/Error' }
  /roles:
    get:
      operationId: listRoles
      x-permission: manage_users_roles
      responses:
        '200': { description: 'Roles, permisos, cuentas asignadas y userCount (usuarios no desactivados)' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createRole
      x-permission: manage_users_roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201': { description: ID del nuevo rol }
        default: { $ref: '#/components/responses/Error' }
  /roles/{roleId}:
    parameters:
      - { $ref: '#/components/parameters/RoleId' }
    patch:
      operationId: updateRole
      x-permission: manage_users_roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '204': { description: Rol actualizado; revocación efectiva inmediatamente }
        default: { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      operationId: listSettings
      x-permission: manage_settings
      description: Ajustes globales con su valor vigente, el valor por defecto y el rango aceptado.
      responses:
        '200':
          description: Todos los ajustes conocidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Setting' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: saveSettings
      x-permission: manage_settings
      description: >
        Guarda uno o más ajustes en una sola transacción: si uno es inválido no se guarda ninguno.
        `session.idleMinutes` no puede superar `session.absoluteMinutes`. Un valor igual al por defecto
        borra la fila. La duración máxima aplica a las sesiones nuevas; la inactividad y la seguridad, de inmediato.
        Queda un evento de auditoría (`object_type=settings`) con los valores anterior y nuevo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  properties:
                    session.absoluteMinutes: { type: integer, minimum: 15, maximum: 43200 }
                    session.idleMinutes: { type: integer, minimum: 5, maximum: 43200 }
                    security.passwordMinLength: { type: integer, minimum: 8, maximum: 64 }
                    security.maxFailedLogins: { type: integer, minimum: 3, maximum: 20 }
                    security.lockoutMinutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        '204': { description: Ajustes guardados }
        default: { $ref: '#/components/responses/Error' }
  /audit:
    get:
      operationId: listAudit
      x-permission: view_audit
      responses:
        '200': { description: 'Últimos 100 eventos visibles, con actorName, accountAlias y objectName (usuario o rol)' }
        default: { $ref: '#/components/responses/Error' }
  /audit.csv:
    get:
      operationId: exportAudit
      x-permission: view_audit
      responses:
        '200':
          description: Hasta 10000 eventos visibles, sin secretos
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /notices:
    get:
      operationId: listNotices
      responses:
        '200': { description: 'Avisos visibles del usuario activo; counts lleva solo cantidades (p. ej. new_mail con messages y notifications), nunca asuntos ni contenido' }
        default: { $ref: '#/components/responses/Error' }
  /notices/{noticeId}/read:
    parameters:
      - { $ref: '#/components/parameters/NoticeId' }
    post:
      operationId: markNoticeRead
      responses:
        '204': { description: Aviso leído localmente }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    cookieAuth: { type: apiKey, in: cookie, name: bz_session }
  parameters:
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    FileId: { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    NoticeId: { name: noticeId, in: path, required: true, schema: { type: string, format: uuid } }
    TestId: { name: testId, in: path, required: true, schema: { type: string, format: uuid } }
    FetchId: { name: fetchId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Código tipado; el HTTP depende del código
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Setting:
      type: object
      required: [key, group, unit, value, default, min, max, updatedAt]
      properties:
        key:
          type: string
          enum: [session.absoluteMinutes, session.idleMinutes, security.passwordMinLength, security.maxFailedLogins, security.lockoutMinutes]
        group: { type: string, enum: [session, security] }
        unit: { type: string, enum: [minutes, characters, attempts] }
        value: { type: integer }
        default: { type: integer }
        min: { type: integer }
        max: { type: integer }
        updatedAt: { type: string, format: date-time, nullable: true, description: Null si usa el valor por defecto }
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [unauthenticated, forbidden, not_found, validation, needs_credential, invalid_credential, remote_session_expired, remote_disabled, remote_unavailable, schema_changed, incomplete_inventory, conflict_running, paused, storage_unavailable, internal]
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResult:
      type: object
      required: [expiresAt]
      properties:
        token: { type: string, description: Token opaco; solo con Bearer (sin X-Session-Mode) y solo en esta respuesta }
        expiresAt: { type: string, format: date-time }
    Principal:
      type: object
      required: [id, email, name, roleId, roleName, permissions, allAccounts, accountIds, preferences, policy]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        preferences:
          type: object
          required: [readWarningEnabled]
          properties:
            readWarningEnabled: { type: boolean }
        policy:
          type: object
          required: [passwordMinLength]
          properties:
            passwordMinLength: { type: integer, description: Mínimo vigente para contraseñas nuevas }
        permissions:
          type: array
          items: { type: string }
        allAccounts: { type: boolean }
        accountIds:
          type: array
          items: { type: string, format: uuid }
    Catalog:
      type: object
      required: [accountId, items, observedAt, lastAttempt]
      properties:
        accountId: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string, description: Código SUNAT; se conservan códigos desconocidos }
              name: { type: string }
              color: { type: string, nullable: true }
              messageCount: { type: integer, nullable: true }
        observedAt: { type: string, format: date-time, nullable: true }
        lastAttempt: { type: string, nullable: true, enum: [ok, unavailable, null], description: Resultado en la última corrida iniciada }
    MailItem:
      type: object
      required: [id, box, tipoMsj, codMensaje, indEstado, remoteState, reviewed]
      properties:
        id: { type: string, format: uuid }
        box: { type: string, enum: [messages, notifications] }
        tipoMsj: { type: integer, enum: [1, 2] }
        codMensaje: { type: string }
        indEstado: { type: integer, description: Estado observado en SUNAT (valor original) }
        remoteState: { type: string, enum: [unread, read] }
        subject: { type: string, nullable: true, description: desAsunto original; puede contener entidades HTML }
        sender: { type: string, nullable: true }
        publishedAtText: { type: string, nullable: true, description: fecPublica tal como llegó, sin zona }
        publishedAt: { type: string, format: date-time, nullable: true, description: fecPublica interpretada en America/Lima }
        folderCode: { type: string, nullable: true }
        labelCode: { type: string, nullable: true }
        attachmentCount: { type: integer, nullable: true, description: cantidadArchAdj anunciado en el listado }
        reviewed: { type: boolean, description: Estado local de este usuario }
        firstSeenAt: { type: string, format: date-time }
        labelName: { type: string, nullable: true, description: Nombre de la etiqueta en el último catálogo observado }
        labelColor: { type: string, nullable: true, description: Color #rrggbb de la etiqueta en el último catálogo observado }
        starred: { type: boolean, description: indDesta=1 }
        urgent: { type: boolean, description: indUrg=1 }
        reviewedAt: { type: string, format: date-time, nullable: true }
        openedByUser: { type: boolean, description: Este usuario completó una lectura explícita del elemento }
        contentStored: { type: boolean, description: Hay contenido guardado para el elemento }
        storedFiles: { type: integer, description: Archivos del elemento ya guardados }
    AccountRunResult:
      type: object
      required: [accountId, runId, state, code]
      properties:
        accountId: { type: string, format: uuid }
        runId: { type: string, format: uuid, nullable: true }
        state: { type: string, nullable: true, enum: [pending, running] }
        code: { type: string, nullable: true, description: Código de error de la cuenta que no pudo iniciar }
    MailboxSettingsInput:
      type: object
      required: [archiveContent, archiveFiles, archiveBatchSize]
      properties:
        archiveContent: { type: boolean, description: Guardar el contenido de elementos ya leídos en SUNAT }
        archiveFiles: { type: boolean, description: Guardar además sus archivos; exige archiveContent }
        archiveBatchSize: { type: integer, minimum: 1, maximum: 2000, description: Elementos por lote y sesión }
    MailboxSettings:
      allOf:
        - { $ref: '#/components/schemas/MailboxSettingsInput' }
        - type: object
          required: [accountId]
          properties:
            accountId: { type: string, format: uuid }
    ArchiveRunResult:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [pending, running] }
    ArchiveRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string, enum: [manual, inventory, continue] }
        state: { type: string, enum: [pending, running, complete, partial] }
        errorCode: { type: string, nullable: true }
        itemsDone: { type: integer }
        itemsFailed: { type: integer }
        filesStored: { type: integer }
        filesFailed: { type: integer }
        remaining: { type: integer, nullable: true, description: Elementos leídos aún sin archivar al terminar el lote }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    ArchiveStatus:
      type: object
      required: [settings, items, files, current, history]
      properties:
        settings: { $ref: '#/components/schemas/MailboxSettings' }
        items:
          type: object
          properties:
            total: { type: integer }
            readInSunat: { type: integer }
            unreadInSunat: { type: integer, description: No se archivan; requieren lectura explícita }
            withContent: { type: integer }
            pendingContent: { type: integer, description: Leídos en SUNAT sin contenido guardado }
        files:
          type: object
          properties:
            stored: { type: integer }
            pending: { type: integer }
            failed: { type: integer }
        current: { allOf: [{ $ref: '#/components/schemas/ArchiveRun' }], nullable: true }
        history:
          type: array
          items: { $ref: '#/components/schemas/ArchiveRun' }
    RunResult:
      type: object
      required: [id, state]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [pending, running, complete, partial, retrying, paused] }
    ReadResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
    ReviewInput:
      type: object
      required: [reviewed]
      properties:
        reviewed: { type: boolean }
    AccountInput:
      type: object
      required: [alias, ruc, solUser]
      properties:
        alias: { type: string, maxLength: 160 }
        ruc: { type: string, pattern: '^[0-9]{11}$', writeOnly: true }
        solUser: { type: string, maxLength: 100, writeOnly: true }
    PreferencesInput:
      type: object
      required: [readWarningEnabled]
      properties:
        readWarningEnabled: { type: boolean }
    AccountUpdate:
      type: object
      required: [alias]
      properties:
        alias: { type: string, maxLength: 160 }
        solUser: { type: string, maxLength: 100, writeOnly: true }
    ActiveInput:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    CredentialInput:
      type: object
      required: [solPassword]
      properties:
        solPassword: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    UserInput:
      type: object
      required: [name, email, password, roleId]
      properties:
        name: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
        roleId: { type: string, format: uuid }
    UserUpdate:
      type: object
      required: [name, email, roleId]
      properties:
        name: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        roleId: { type: string, format: uuid }
    UserStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    RoleInput:
      type: object
      required: [name, permissions, allAccounts, accountIds]
      properties:
        name: { type: string, maxLength: 100 }
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [view_mailbox, read_content, download_file, mark_reviewed, run_inventory, view_audit, configure_schedule, manage_accounts, manage_users_roles, manage_settings]
        allAccounts: { type: boolean }
        accountIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    ScheduleInput:
      type: object
      required: [frequency, days, windowStart, windowEnd, boxes, state, downloadReadAttachments, notifyInApp, notifyDailyEmail, remoteEffectAccepted]
      properties:
        frequency: { type: string, enum: [30m, 1h, 2h, 4h, daily] }
        days:
          type: array
          minItems: 1
          items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        windowStart: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        windowEnd: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        boxes:
          type: array
          minItems: 1
          items: { type: string, enum: [messages, notifications] }
        state: { type: string, enum: [disabled, paused, active], description: active exige SUNAT_CRON_VALIDATED, SUNAT_TRANSPORT_VALIDATED y credencial válida }
        downloadReadAttachments: { type: boolean }
        notifyInApp: { type: boolean }
        notifyDailyEmail: { type: boolean, const: false }
        remoteEffectAccepted: { type: boolean }
