# nginx en el host. Sustituir buzon.example.com / api.buzon.example.com y las rutas de los certificados.
# Dos orígenes: la web (archivos estáticos) y la API (proxy a Docker en 127.0.0.1:38080).
# Los dos deben compartir dominio padre (example.com) para que SameSite=Strict siga enviando la cookie de sesión.
# CORS lo responde la API (CORS_ALLOWED_ORIGINS); no repetirlo aquí.

server {
    listen 80;
    server_name buzon.example.com api.buzon.example.com;
    return 301 https://$host$request_uri;
}

# Frontend: contenedor `web` de compose.prod.yml (estáticos + fallback SPA) en 127.0.0.1:38081.
server {
    listen 443 ssl;
    http2 on;
    server_name buzon.example.com;

    ssl_certificate     /etc/letsencrypt/live/buzon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buzon.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:38081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend
server {
    listen 443 ssl;
    http2 on;
    server_name api.buzon.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.buzon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.buzon.example.com/privkey.pem;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:38080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
